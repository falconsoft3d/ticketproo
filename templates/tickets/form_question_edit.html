{% extends 'base.html' %}
{% load i18n %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h4><i class="bi bi-pencil"></i> {% translate "Editar Pregunta" %}</h4>
                </div>
                <form method="post">
                    <div class="card-body">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label">{% translate "Texto de la pregunta" %}</label>
                            <textarea name="text" class="form-control" rows="3" required>{{ question.question_text }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">{% translate "Tipo de pregunta" %}</label>
                                    <select name="question_type" class="form-select" required>
                                        <option value="text" {% if question.question_type == 'text' %}selected{% endif %}>{% translate "Texto libre" %}</option>
                                        <option value="number" {% if question.question_type == 'number' %}selected{% endif %}>{% translate "Cantidad (Número)" %}</option>
                                        <option value="multiple_choice" {% if question.question_type == 'multiple_choice' %}selected{% endif %}>{% translate "Selección múltiple" %}</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label class="form-label">{% translate "Orden" %}</label>
                                    <input type="number" name="order" class="form-control" value="{{ question.order }}" min="0">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" name="is_required" {% if question.is_required %}checked{% endif %}>
                            <label class="form-check-label">{% translate "Pregunta obligatoria" %}</label>
                        </div>
                        
                        <div class="alert alert-info">
                            <i class="bi bi-info-circle"></i> 
                            <strong>{% translate "Formulario:" %}</strong> {{ form_obj.title }}
                        </div>
                    </div>
                    <div class="card-footer">
                        <div class="d-flex justify-content-between">
                            <a href="{% url 'form_detail' form_obj.pk %}" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> {% translate "Cancelar" %}
                            </a>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check"></i> {% translate "Guardar Cambios" %}
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
