{% extends 'base.html' %}
{% load i18n %}
{% block content %}
<div class="container">
  <h1>{{ form_title }}</h1>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" type="submit">{% translate "Guardar" %}</button>
    <a class="btn btn-secondary" href="{% url 'company_request_generator_list' %}">{% translate "Cancelar" %}</a>
  </form>
</div>
{% endblock %}
